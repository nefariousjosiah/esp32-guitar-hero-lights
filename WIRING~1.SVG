<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold">ESP32 LED Reflex Game - Wiring Diagram</text>

  <!-- ESP32 board -->
  <rect x="410" y="260" width="180" height="160" rx="10" fill="#1f4e5f" stroke="#0d2b35" stroke-width="2"/>
  <text x="500" y="290" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">ESP32</text>
  <text x="500" y="308" text-anchor="middle" fill="#9fd8e8" font-size="11">Dev Board</text>
  <rect x="460" y="320" width="80" height="50" fill="#163a47"/>
  <text x="500" y="350" text-anchor="middle" fill="#9fd8e8" font-size="9">USB</text>

  <!-- Lane strips (top row) -->
  <!-- Blue lane -->
  <g>
    <rect x="60" y="70" width="220" height="40" rx="6" fill="#2b6fd6" stroke="#123a75" stroke-width="2"/>
    <text x="170" y="95" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Blue strip (8 LEDs)</text>
    <line x1="170" y1="110" x2="450" y2="260" stroke="#2b6fd6" stroke-width="2"/>
    <text x="300" y="180" text-anchor="middle" font-size="11" fill="#2b6fd6">DATA -> GPIO 13</text>
  </g>

  <!-- Green lane -->
  <g>
    <rect x="390" y="70" width="220" height="40" rx="6" fill="#2ea043" stroke="#155a24" stroke-width="2"/>
    <text x="500" y="95" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Green strip (8 LEDs)</text>
    <line x1="500" y1="110" x2="500" y2="260" stroke="#2ea043" stroke-width="2"/>
    <text x="540" y="185" text-anchor="middle" font-size="11" fill="#2ea043">DATA -></text>
    <text x="540" y="198" text-anchor="middle" font-size="11" fill="#2ea043">GPIO 12</text>
  </g>

  <!-- Yellow lane -->
  <g>
    <rect x="720" y="70" width="220" height="40" rx="6" fill="#e0b400" stroke="#6b5600" stroke-width="2"/>
    <text x="830" y="95" text-anchor="middle" fill="#3a2f00" font-size="13" font-weight="bold">Yellow strip (8 LEDs)</text>
    <line x1="830" y1="110" x2="550" y2="260" stroke="#e0b400" stroke-width="2"/>
    <text x="720" y="180" text-anchor="middle" font-size="11" fill="#7a6400">DATA -> GPIO 14</text>
  </g>

  <!-- Power bus note -->
  <text x="500" y="130" text-anchor="middle" font-size="11" fill="#555">All 3 strips: 5V -> 5V/VIN pin, GND -> GND pin (shared)</text>

  <!-- Buttons (bottom row) -->
  <!-- Blue button -->
  <g>
    <rect x="90" y="500" width="90" height="45" rx="6" fill="#2b6fd6" stroke="#123a75" stroke-width="2"/>
    <text x="135" y="527" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Blue btn</text>
    <line x1="135" y1="500" x2="450" y2="380" stroke="#2b6fd6" stroke-width="2"/>
    <text x="270" y="430" text-anchor="middle" font-size="11" fill="#2b6fd6">-> GPIO 32</text>
    <text x="135" y="560" text-anchor="middle" font-size="10">other leg -> GND</text>
  </g>

  <!-- Green button -->
  <g>
    <rect x="455" y="500" width="90" height="45" rx="6" fill="#2ea043" stroke="#155a24" stroke-width="2"/>
    <text x="500" y="527" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Green btn</text>
    <line x1="500" y1="500" x2="500" y2="420" stroke="#2ea043" stroke-width="2"/>
    <text x="500" y="470" text-anchor="middle" font-size="11" fill="#2ea043">-> GPIO 33</text>
    <text x="500" y="560" text-anchor="middle" font-size="10">other leg -> GND</text>
  </g>

  <!-- Yellow button -->
  <g>
    <rect x="820" y="500" width="90" height="45" rx="6" fill="#e0b400" stroke="#6b5600" stroke-width="2"/>
    <text x="865" y="527" text-anchor="middle" fill="#3a2f00" font-size="12" font-weight="bold">Yellow btn</text>
    <line x1="865" y1="500" x2="550" y2="380" stroke="#e0b400" stroke-width="2"/>
    <text x="730" y="430" text-anchor="middle" font-size="11" fill="#7a6400">-> GPIO 25</text>
    <text x="865" y="560" text-anchor="middle" font-size="10">other leg -> GND</text>
  </g>

  <!-- legend -->
  <text x="500" y="610" text-anchor="middle" font-size="12" fill="#333">
    Each strip: note pixel starts at the far LED and moves toward the ESP32-side LED (the "hit zone").
  </text>
  <text x="500" y="628" text-anchor="middle" font-size="12" fill="#333">
    Press the matching button when the lit pixel reaches that last LED.
  </text>
</svg>
